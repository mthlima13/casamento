version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: convite-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=convitedb

  api:
    build: .
    container_name: convite-api
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/convitedb
    profiles:
      - app # O profile app permite rodar a API no docker opcionalmente. Sem isso, sobe apenas o banco.

volumes:
  mongo_data:
